<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Guru Benchmark</title>
  <desc id="desc">Source-grounded expert judgment synthesized into one transparent verdict.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.52" stop-color="#11162A"/>
      <stop offset="1" stop-color="#081B1B"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B93FF"/>
      <stop offset="0.5" stop-color="#62E6C4"/>
      <stop offset="1" stop-color="#F4C766"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#F7FFF9"/>
      <stop offset="0.3" stop-color="#87F1D0"/>
      <stop offset="1" stop-color="#246B62"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M0 515 C270 420 420 675 700 545 S1045 430 1280 505 V640 H0Z" fill="#56DAB9" opacity="0.045"/>

  <g transform="translate(86 80)">
    <rect width="196" height="36" rx="18" fill="#111A24" stroke="#62E6C4" stroke-opacity="0.52"/>
    <circle cx="20" cy="18" r="5" fill="#62E6C4"/>
    <text x="36" y="23" fill="#C9F8EA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">LIVING STANDARD</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="84" y="205" fill="#F7F8FC" font-size="72" font-weight="800" letter-spacing="-2.8">GURU</text>
    <text x="84" y="280" fill="url(#signal)" font-size="72" font-weight="800" letter-spacing="-2.8">BENCHMARK</text>
    <text x="88" y="334" fill="#B8C0D6" font-size="23" font-weight="500">Source-grounded expert judgment, synthesized.</text>

    <g transform="translate(88 385)">
      <rect width="190" height="52" rx="13" fill="#171E31" stroke="#8B93FF" stroke-opacity="0.35"/>
      <text x="18" y="22" fill="#858FB2" font-size="11" font-weight="700" letter-spacing="1.3">DEFAULT OUTPUT</text>
      <text x="18" y="41" fill="#F7F8FC" font-size="16" font-weight="650">ONE VERDICT</text>
    </g>
    <g transform="translate(292 385)">
      <rect width="190" height="52" rx="13" fill="#151F28" stroke="#62E6C4" stroke-opacity="0.35"/>
      <text x="18" y="22" fill="#7CA99D" font-size="11" font-weight="700" letter-spacing="1.3">CRITICAL RULE</text>
      <text x="18" y="41" fill="#F7F8FC" font-size="16" font-weight="650">HARD GATES</text>
    </g>
    <g transform="translate(496 385)">
      <rect width="190" height="52" rx="13" fill="#211D1A" stroke="#F4C766" stroke-opacity="0.35"/>
      <text x="18" y="22" fill="#B6A16E" font-size="11" font-weight="700" letter-spacing="1.3">WHEN IT MATTERS</text>
      <text x="18" y="41" fill="#F7F8FC" font-size="16" font-weight="650">CLARIFICATION</text>
    </g>
  </g>

  <g transform="translate(955 303)">
    <circle r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    <circle r="127" fill="none" stroke="#8B93FF" stroke-opacity="0.18" stroke-dasharray="6 11"/>
    <circle r="72" fill="#62E6C4" opacity="0.05"/>
    <circle r="25" fill="url(#core)" filter="url(#glow)"/>
    <text x="0" y="61" fill="#AAB7CA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">SYNTHESIS</text>

    <g fill="#111725" stroke-width="2">
      <circle cx="0" cy="-151" r="34" stroke="#8B93FF"/>
      <circle cx="118" cy="-94" r="34" stroke="#A58DFF"/>
      <circle cx="147" cy="34" r="34" stroke="#62E6C4"/>
      <circle cx="65" cy="136" r="34" stroke="#68D4A5"/>
      <circle cx="-65" cy="136" r="34" stroke="#F4C766"/>
      <circle cx="-147" cy="34" r="34" stroke="#F09F68"/>
      <circle cx="-118" cy="-94" r="34" stroke="#78B8FF"/>
    </g>

    <g stroke="#AEB8D2" stroke-opacity="0.32">
      <path d="M0-117 L0-28"/><path d="M94-73 L22-17"/><path d="M113 26 L27 6"/>
      <path d="M50 105 L13 25"/><path d="M-50 105 L-13 25"/><path d="M-113 26 L-27 6"/><path d="M-94-73 L-22-17"/>
    </g>

    <g fill="#EEF2FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
      <text x="0" y="-147">AK</text><text x="118" y="-90">MP</text><text x="147" y="38">PS</text>
      <text x="65" y="140">RH</text><text x="-65" y="140">DHH</text><text x="-147" y="38">SW</text><text x="-118" y="-90">MH</text>
    </g>
  </g>

  <g transform="translate(86 557)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="1108" height="1" fill="url(#signal)" opacity="0.45"/>
    <text y="34" fill="#7D879E" font-size="13" font-weight="600" letter-spacing="0.45">EVIDENCE BEFORE PERSONA</text>
    <text x="348" y="34" fill="#7D879E" font-size="13" font-weight="600" letter-spacing="0.45">CONTEXT BEFORE CONSENSUS</text>
    <text x="758" y="34" fill="#7D879E" font-size="13" font-weight="600" letter-spacing="0.45">ACTION OVER ADMIRATION</text>
  </g>
</svg>
